# Deploys the static site to GitLab Pages.
# The site is 100% static (no build step needed) — we just publish the files.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r index.html css js public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
